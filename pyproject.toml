[project]
name = "cachingmicroservicefastapitest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sergey Levchenko", email = "ironias41@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
cache-cli = "app.cli:main"
cachingmicroservicefastapitest = "cachingmicroservicefastapitest:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv.build-backend]
module-name = "app"
module-root = "."
